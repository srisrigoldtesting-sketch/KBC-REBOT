name: Bot checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Windows launcher test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m venv --system-site-packages .venv-windows
          call INSTALL.cmd --check
          if errorlevel 1 exit /b 1
          call RUN.cmd test --no-pause
          if errorlevel 1 exit /b 1
      - name: Windows settings window smoke test
        if: runner.os == 'Windows'
        run: |
          python -c "import tkinter; from unittest.mock import patch; from app.configure import main; p=patch.object(tkinter.Tk, 'mainloop', lambda window: window.destroy()); p.start(); main()"
      - name: Windows local parts tools smoke test
        if: runner.os == 'Windows'
        run: |
          python -c "import sys; from unittest.mock import patch; from app.parts_tool import main; p=patch('tkinter.filedialog.askopenfilename', return_value=''); p.start(); sys.argv=['parts','join']; assert main()==0; sys.argv=['parts','split']; assert main()==0"
